<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf8f5"/>
      <stop offset="100%" style="stop-color:#f3f0eb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#b8860b"/>
  <!-- Notebook icon -->
  <text x="600" y="200" font-size="80" text-anchor="middle" dominant-baseline="central">📓</text>
  <!-- Brand name -->
  <text x="600" y="310" font-family="Georgia, serif" font-size="56" font-weight="700" fill="#1a1a1a" text-anchor="middle" letter-spacing="-1">freenotepad.app</text>
  <!-- Tagline -->
  <text x="600" y="380" font-family="Georgia, serif" font-size="26" fill="#8a8580" text-anchor="middle">Free Online Notepad — No Login, No Cloud</text>
  <!-- Features line -->
  <text x="600" y="440" font-family="sans-serif" font-size="18" fill="#b8860b" text-anchor="middle">Rich Text · Dark Mode · Offline · 100% Private · Export to Markdown</text>
  <!-- Bottom accent bar -->
  <rect x="0" y="624" width="1200" height="6" fill="#b8860b"/>
</svg>
